[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robotsix-memory"
version = "0.6.2"
description = "Fleet memory component — stable memory API wrapping a Hindsight memory bank"
license = { text = "MIT" }
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.3",
    "httpx>=0.28.0",
    "pydantic>=2.13.0",
    "prometheus-fastapi-instrumentator>=0.20.0",
    "prometheus-client>=0.20.0",
    "robotsix-config>=0.6.0",
    "robotsix-http[fastapi]>=0.6",
    "robotsix-llmio>=0.7.6",
    "structlog>=24.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "respx>=0.22.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "robotsix-modules",
]

[tool.uv]
required-version = ">=0.12.5"
# robotsix-llmio pins robotsix-http at an older rev via its own tool.uv.sources;
# force the whole resolution (including that transitive requirement) onto
# memory's newer robotsix-http rev, which satisfies llmio's ">= 0.3.2" floor, so
# the conflicting transitive git URLs collapse onto one rev.
override-dependencies = [
    "robotsix-http @ git+https://github.com/damien-robotsix/robotsix-http.git@a77b6b11e2e24f23421051e4388a9130eb2b93c5",
]

[tool.uv.sources]
robotsix-config = { git = "https://github.com/damien-robotsix/robotsix-config.git", rev = "8b9fa37f53b179986ca8b8f603d8786b9aa06018" }
robotsix-http = { git = "https://github.com/damien-robotsix/robotsix-http.git", rev = "a77b6b11e2e24f23421051e4388a9130eb2b93c5" }
robotsix-llmio = { git = "https://github.com/damien-robotsix/robotsix-llmio.git", rev = "97b69c33b0c836b9f288ab5c69b913876b1229d7" }
robotsix-modules = { git = "https://github.com/damien-robotsix/robotsix-modules.git", rev = "8fed749b0913c3dcb2200ada5cf6cf14f9f9f6ea" }

[tool.hatch.build.targets.wheel]
packages = ["src/robotsix_memory"]

[tool.deptry]
known_first_party = ["robotsix_memory"]

[tool.deptry.per_rule_ignores]
# uvicorn is the runtime server invoked by the container CMD, not an import.
DEP002 = ["uvicorn"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "C4", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately assert, and use throwaway credentials and temp paths.
"tests/**/*.py" = ["S101", "S105", "S106", "S108"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
