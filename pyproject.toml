[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robotsix-memory"
version = "0.6.1"
description = "Fleet memory component — stable memory API wrapping a Hindsight memory bank"
license = { text = "MIT" }
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.3",
    "httpx>=0.28.0",
    "pydantic>=2.13.0",
    "prometheus-fastapi-instrumentator>=0.20.0",
    "prometheus-client>=0.20.0",
    "robotsix-config>=0.6.0",
    "robotsix-http[fastapi]>=0.6",
    "robotsix-llmio>=0.7.6",
    "structlog>=24.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "respx>=0.22.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "robotsix-modules",
]

[tool.uv]
required-version = ">=0.12.5"
# robotsix-llmio pins robotsix-http at an older rev via its own tool.uv.sources;
# force the whole resolution (including that transitive requirement) onto
# memory's newer robotsix-http rev, which satisfies llmio's ">= 0.3.2" floor, so
# the conflicting transitive git URLs collapse onto one rev.
override-dependencies = [
    "robotsix-http @ git+https://github.com/damien-robotsix/robotsix-http.git@726254c4e24e56b409dd9f954b097eebf1c1c0a0",
]

[tool.uv.sources]
robotsix-config = { git = "https://github.com/damien-robotsix/robotsix-config.git", rev = "82826f8f56f29629fa2c1dc691245349e8de1e54" }
robotsix-http = { git = "https://github.com/damien-robotsix/robotsix-http.git", rev = "726254c4e24e56b409dd9f954b097eebf1c1c0a0" }
robotsix-llmio = { git = "https://github.com/damien-robotsix/robotsix-llmio.git", rev = "c47468306f8d1a4cf3094f8fa6bd526c2a500eed" }
robotsix-modules = { git = "https://github.com/damien-robotsix/robotsix-modules.git", rev = "1c7d01f4ed264524857838fad78b5a3d05d3d774" }

[tool.hatch.build.targets.wheel]
packages = ["src/robotsix_memory"]

[tool.deptry]
known_first_party = ["robotsix_memory"]

[tool.deptry.per_rule_ignores]
# uvicorn is the runtime server invoked by the container CMD, not an import.
DEP002 = ["uvicorn"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "C4", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately assert, and use throwaway credentials and temp paths.
"tests/**/*.py" = ["S101", "S105", "S106", "S108"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
