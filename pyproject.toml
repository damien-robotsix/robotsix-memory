[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robotsix-memory"
version = "0.2.0"
description = "Fleet memory component — stable memory API wrapping a Hindsight memory bank"
license = { text = "MIT" }
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.3",
    "httpx>=0.28.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.7.0",
    "robotsix-http>=0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "respx>=0.22.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[tool.uv]
required-version = ">=0.12.5"

[tool.uv.sources]
robotsix-http = { git = "https://github.com/damien-robotsix/robotsix-http.git", rev = "c57947232685f4e4798a61e2bc53d747d3dbc75d" }

[tool.hatch.build.targets.wheel]
packages = ["src/robotsix_memory"]

[tool.deptry]
known_first_party = ["robotsix_memory"]

[tool.deptry.per_rule_ignores]
# uvicorn is the runtime server invoked by the container CMD, not an import.
DEP002 = ["uvicorn"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "C4", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately assert, and use throwaway credentials and temp paths.
"tests/**/*.py" = ["S101", "S105", "S106", "S108"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
