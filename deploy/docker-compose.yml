# central-deploy-contract-version: 1
# Deployment contract for the central-deploy onboarding parser.
#
# Two services: the fleet-facing wrapper (primary) and the Hindsight memory
# engine (sibling). The engine keeps its embedded pg0 Postgres on a named
# volume and is reachable only on the internal network — no host ports.
# Empty-string env values are secrets supplied at onboarding.
services:
  memory:
    image: ghcr.io/damien-robotsix/robotsix-memory@sha256:506416fed38abb9c7e691899b5f1361cce8fe003f239cc3c830a71a519c1e5ce
    container_name: memory
    ports:
      - "8310:8080"
    environment:
      ROBOTSIX_CONFIG_FILE: /home/app/config/config.json
      MEMORY_HINDSIGHT_URL: http://memory-hindsight:8888
    labels:
      robotsix.deploy.primary: "true"
      robotsix.deploy.config-target: /home/app/config/config.json
    volumes:
      - memory-config-data:/home/app/config
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health/live').read()",
        ]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3

  memory-hindsight:
    image: ghcr.io/vectorize-io/hindsight:0.9.2@sha256:84ab276b8f501546deb6ea9c64a57291718b4e16a59dd9e02a02fdd5adfe9028
    container_name: memory-hindsight
    shm_size: "1gb"
    environment:
      HINDSIGHT_API_LLM_PROVIDER: openai
      HINDSIGHT_API_LLM_BASE_URL: https://openrouter.ai/api/v1
      HINDSIGHT_API_LLM_MODEL: openai/gpt-5-nano
      HINDSIGHT_API_LLM_API_KEY: ""
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: openai
      HINDSIGHT_API_EMBEDDINGS_OPENAI_BASE_URL: https://embed.robotsix.net/v1
      HINDSIGHT_API_EMBEDDINGS_OPENAI_MODEL: bge-m3
      HINDSIGHT_API_EMBEDDINGS_OPENAI_API_KEY: ""
    volumes:
      - memory-hindsight-data:/home/hindsight/.pg0

volumes:
  memory-config-data:
  memory-hindsight-data:
