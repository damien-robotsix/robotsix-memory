name: release-please

# Fleet-wide release automation per robotsix-standards release-please.md.
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - closed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    name: Release Please
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.head.ref == 'release-please--branches--main')
    permissions:
      contents: write # create the release commit, tag and GitHub Release
      pull-requests: write # open and update the release PR
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/release-please.yml@6d737634940626eed0bec995c8e462892730e610 # main
    with:
      app-id: ${{ vars.RELEASE_APP_ID }}
    secrets:
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
