name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  tests:
    name: Python CI
    permissions:
      contents: read
      security-events: write # SARIF upload from the reusable workflow
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-ci.yml@fb907a46b00693a117ca6b975da6e7b0f8238491 # main
    with:
      python-version: "3.14"
      # Must match required-version in pyproject.toml ([tool.uv]).
      uv-version: "0.12.5"
      cov-package: src/robotsix_memory
      install-extras: ""
      mypy-advisory: false

  lockfile-security:
    name: uv audit + lockfile freshness
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # SARIF upload for the uv audit scan
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5" # must match required-version in pyproject.toml ([tool.uv])
      - name: Check lockfile freshness
        run: uv lock --check
      - name: Run uv audit (CVE / malware scan)
        # Always upload the SARIF so findings surface in the Security tab. uv
        # audit exits non-zero when it finds a vulnerability, which would skip
        # the upload-sarif step below and hide the very findings we want to
        # surface. continue-on-error lets the SARIF (written regardless of exit
        # code) reach code scanning even when the lockfile graph has a CVE.
        continue-on-error: true
        run: uv audit --frozen --output-format sarif > uv-audit.sarif
      - name: Upload uv audit SARIF to code scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: uv-audit.sarif
