name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  tests:
    name: Python CI
  lint-workflows:
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/lint-workflows.yml@<same pinned sha as python-ci>
    with:
      run-actionlint: true
      run-zizmor: true
    permissions:
      contents: read
      security-events: write # SARIF upload from the reusable workflow
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-ci.yml@188518bece972d7d5f1c4e2a0f2226d2526dc0fa # main
    with:
      python-version: "3.14"
      # Must match required-version in pyproject.toml ([tool.uv]).
      uv-version: "0.12.5"
      cov-package: src/robotsix_memory
      install-extras: ""
      mypy-advisory: false

  lockfile-security:
    name: uv audit + lockfile freshness
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # SARIF upload for the uv audit scan
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.5" # must match required-version in pyproject.toml ([tool.uv])
      - name: Check lockfile freshness
        run: uv lock --check
      - name: Run uv audit (CVE / malware scan)
        # Always upload the SARIF so findings surface in the Security tab. uv
        # audit exits non-zero when it finds a vulnerability, which would skip
        # the upload-sarif step below and hide the very findings we want to
        # surface. continue-on-error lets the SARIF (written regardless of exit
        # code) reach code scanning even when the lockfile graph has a CVE.
        continue-on-error: true
        run: uv audit --frozen --output-format sarif > uv-audit.sarif
      - name: Upload uv audit SARIF to code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: uv-audit.sarif
