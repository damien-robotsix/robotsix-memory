name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  tests:
    name: Python CI
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-ci.yml@188518bece972d7d5f1c4e2a0f2226d2526dc0fa # main
    with:
      python-version: "3.14"
      # Must match required-version in pyproject.toml ([tool.uv]).
      uv-version: "0.12.5"
      cov-package: src/robotsix_memory
      install-extras: ""
      mypy-advisory: false
    permissions:
      contents: read
      security-events: write # SARIF upload from the reusable workflow

  lint-workflows:
    name: Lint workflows
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/lint-workflows.yml@188518bece972d7d5f1c4e2a0f2226d2526dc0fa # main
    with:
      run-actionlint: true
      run-zizmor: true
    permissions:
      contents: read
      security-events: write # SARIF upload from the reusable workflow

  # Dockerfile lint gate: run hadolint against the only Dockerfile and upload
  # its SARIF to code scanning.
  lint-dockerfile:
    name: Lint Dockerfile
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/lint-dockerfile.yml@47523e8aa2d34d41da060d29b57f75ab262cb840 # v1.4.0
    with:
      dockerfiles: Dockerfile
      upload-sarif: true
    permissions:
      contents: read
      security-events: write # SARIF upload from the reusable workflow

  # Pre-merge image gate: build the image (push: false) and fail on unfixed
  # CRITICAL/HIGH Trivy findings before merge. docker-publish.yml only scans
  # after the image is pushed. Pinned to the same SHA as docker-release.yml.
  docker-pr-scan:
    name: Docker PR scan
    if: github.event_name == 'pull_request'
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/docker-pr-scan.yml@c4caf23ade98668434145f5b1abd3bc42cec63e7 # main
    permissions:
      contents: read
      security-events: write # SARIF upload from the reusable workflow

  # PR gate: fail on newly introduced dependencies with known vulnerabilities
  # of moderate severity or above.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/dependency-review.yml@47523e8aa2d34d41da060d29b57f75ab262cb840 # v1.4.0
    with:
      fail-on-severity: moderate
    permissions:
      contents: read
      pull-requests: write # PR summary comment from dependency-review

  # Modules-drift gate: equivalent of the shared baseline-check.yml
  # `has-board: true` modules job (validate + check-registration +
  # validate-paths against docs/modules.yaml). Inlined rather than calling
  # baseline-check.yml because its baseline job also requires repo scaffolding
  # (AGENT.md, pre-commit) that is out of scope here.
  modules-drift:
    name: Modules drift
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.5" # must match required-version in pyproject.toml ([tool.uv])
          python-version: "3.14"
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Validate modules.yaml
        run: uv run --frozen robotsix-modules validate docs/modules.yaml
      - name: Check module registration
        run: uv run --frozen robotsix-modules check-registration docs/modules.yaml --root .
      - name: Validate module paths
        run: uv run --frozen robotsix-modules validate-paths docs/modules.yaml --root .

  lockfile-security:
    name: uv audit + lockfile freshness
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # SARIF upload for the uv audit scan
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.5" # must match required-version in pyproject.toml ([tool.uv])
      - name: Check lockfile freshness
        run: uv lock --check
      - name: Run uv audit (CVE / malware scan)
        # Always upload the SARIF so findings surface in the Security tab. uv
        # audit exits non-zero when it finds a vulnerability, which would skip
        # the upload-sarif step below and hide the very findings we want to
        # surface. continue-on-error lets the SARIF (written regardless of exit
        # code) reach code scanning even when the lockfile graph has a CVE.
        continue-on-error: true
        run: uv audit --frozen --output-format sarif > uv-audit.sarif
      - name: Upload uv audit SARIF to code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: uv-audit.sarif
