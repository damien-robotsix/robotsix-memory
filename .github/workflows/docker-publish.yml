name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ["*.*.*"]

permissions: {} # no workflow-level default; the job grants its own

jobs:
  docker-release:
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/docker-release.yml@86a722f2938c1dda343bbf8d3c5989613cbf1794 # v1.5.0
    permissions:
      contents: read
      packages: write # push images to ghcr.io
      id-token: write # provenance/SBOM attestation signing
      attestations: write # provenance/SBOM attestation signing
      security-events: write # upload the Trivy SARIF to code scanning
